<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nexoNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05162E"/>
      <stop offset="50%" stop-color="#082041"/>
      <stop offset="100%" stop-color="#030D1C"/>
    </linearGradient>
    <linearGradient id="nexoTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38DFD8"/>
      <stop offset="50%" stop-color="#00A9A3"/>
      <stop offset="100%" stop-color="#007F7B"/>
    </linearGradient>
    <filter id="nexoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Surface (Nexo Talento Navy) -->
  <rect width="512" height="512" rx="128" fill="url(#nexoNavyGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#00A9A3" stroke-width="6" stroke-opacity="0.4"/>

  <!-- NexoLegal Corporate Monogram & Justice Scales -->
  <g transform="translate(256, 256)" filter="url(#nexoGlow)">
    <!-- Central Pillar -->
    <rect x="-8" y="-120" width="16" height="240" rx="8" fill="url(#nexoTealGrad)"/>
    <circle cx="0" cy="-125" r="16" fill="url(#nexoTealGrad)"/>
    <rect x="-60" y="110" width="120" height="18" rx="9" fill="url(#nexoTealGrad)"/>

    <!-- Balance Crossbar -->
    <path d="M-130,-50 L130,-50" stroke="url(#nexoTealGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-50" r="12" fill="#FFFFFF"/>

    <!-- Left Scale (Cords & Dish) -->
    <path d="M-130,-50 L-165,22 L-95,22 Z" fill="none" stroke="#38DFD8" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-175,22 C-175,60 -85,60 -85,22 Z" fill="url(#nexoTealGrad)" opacity="0.95"/>

    <!-- Right Scale (Cords & Dish) -->
    <path d="M130,-50 L95,22 L165,22 Z" fill="none" stroke="#38DFD8" stroke-width="6" stroke-linejoin="round"/>
    <path d="M85,22 C85,60 175,60 175,22 Z" fill="url(#nexoTealGrad)" opacity="0.95"/>

    <!-- Dynamic "N" Sweeping Arc of Nexo Talento -->
    <path d="M-95,68 Q0,-80 95,-60" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
